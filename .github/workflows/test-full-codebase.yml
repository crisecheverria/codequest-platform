name: Full Codebase Tests

on:
  push:
    branches: [main, develop]
    paths: 
      - 'packages/**'
      - '.github/workflows/test-full-codebase.yml'
  pull_request:
    branches: [main]
    paths: 
      - 'packages/**'
      - '.github/workflows/test-full-codebase.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Pre-test checks and setup
  pre-checks:
    name: Pre-test Validation
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'packages/backend/**'
              - '.github/workflows/test-backend.yml'
              - '.github/workflows/test-full-codebase.yml'
            frontend:
              - 'packages/frontend/**'  
              - '.github/workflows/test-frontend.yml'
              - '.github/workflows/test-full-codebase.yml'

  # Backend testing job
  backend-tests:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    needs: pre-checks
    if: needs.pre-checks.outputs.backend-changed == 'true' || github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Verify Go Installation
        run: go version
        
      - name: Install dependencies
        run: |
          npm ci
          npm ci -w packages/backend
        
      - name: Run ESLint
        run: npm run lint -w packages/backend
        
      - name: Build backend
        run: npm run build -w packages/backend
        
      - name: Install MongoDB tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          
      - name: Wait for MongoDB
        run: |
          until mongosh --host localhost:27017 --username admin --password password --authenticationDatabase admin --eval "db.adminCommand('ping')" --quiet; do
            echo "Waiting for MongoDB..."
            sleep 5
          done
          echo "MongoDB is ready"
        
      - name: Run unit tests
        run: npm run test:unit -w packages/backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://admin:password@localhost:27017/test?authSource=admin
          JWT_SECRET: test-jwt-secret-for-ci
          USE_NATIVE_GO_EXECUTOR: false
          DOCKER_TIMEOUT: 10000
          TEST_VERBOSE: false
          
      - name: Run integration tests  
        run: npm run test:integration -w packages/backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://admin:password@localhost:27017/test?authSource=admin
          JWT_SECRET: test-jwt-secret-for-ci
          USE_NATIVE_GO_EXECUTOR: false
          DOCKER_TIMEOUT: 15000
          TEST_VERBOSE: false
          
      - name: Run all tests with coverage
        run: npm run test:coverage -w packages/backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://admin:password@localhost:27017/test?authSource=admin
          JWT_SECRET: test-jwt-secret-for-ci
          USE_NATIVE_GO_EXECUTOR: false
          DOCKER_TIMEOUT: 15000
          TEST_VERBOSE: false

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./packages/backend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: Backend Test Coverage Report
        continue-on-error: true
          
      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: backend
          directory: ./packages/backend/coverage
          fail_ci_if_error: false

  # Frontend testing job
  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: pre-checks
    if: needs.pre-checks.outputs.frontend-changed == 'true' || github.event_name == 'workflow_dispatch'
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          npm ci -w packages/frontend
        
      - name: Run ESLint
        run: npm run lint -w packages/frontend
        
      - name: Run TypeScript check
        run: npx tsc --noEmit -p packages/frontend
        
      - name: Run unit tests
        run: npm run test:unit -w packages/frontend
        env:
          NODE_ENV: test
          
      - name: Run integration tests  
        run: npm run test:integration -w packages/frontend
        env:
          NODE_ENV: test
          
      - name: Run all tests with coverage
        run: npm run test:coverage -w packages/frontend
        env:
          NODE_ENV: test

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./packages/frontend/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: Frontend Test Coverage Report
        continue-on-error: true
          
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: frontend
          directory: ./packages/frontend/coverage
          fail_ci_if_error: false
          
      - name: Build frontend
        run: npm run build -w packages/frontend
        env:
          NODE_ENV: production

  # Security audit for both packages
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always() && (needs.backend-tests.result == 'success' || needs.frontend-tests.result == 'success')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          npm ci -w packages/backend || true
          npm ci -w packages/frontend || true
          
      - name: Run security audit - Backend
        run: npm audit --audit-level moderate -w packages/backend || true
        continue-on-error: true
        
      - name: Run security audit - Frontend
        run: npm audit --audit-level moderate -w packages/frontend || true
        continue-on-error: true

  # Integration test between frontend and backend
  full-integration-test:
    name: Full Integration Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: always() && needs.backend-tests.result == 'success' && needs.frontend-tests.result == 'success'
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Install dependencies
        run: |
          npm ci
          npm ci -w packages/backend
          npm ci -w packages/frontend
        
      - name: Install MongoDB tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-mongosh
          
      - name: Wait for MongoDB
        run: |
          until mongosh --host localhost:27017 --username admin --password password --authenticationDatabase admin --eval "db.adminCommand('ping')" --quiet; do
            echo "Waiting for MongoDB..."
            sleep 5
          done
          echo "MongoDB is ready"
        
      - name: Build all packages
        run: |
          npm run build -w packages/backend
          npm run build -w packages/frontend
        
      - name: Start backend server
        run: |
          npm run start -w packages/backend &
          echo $! > backend.pid
        env:
          NODE_ENV: production
          MONGODB_URI: mongodb://admin:password@localhost:27017/test?authSource=admin
          JWT_SECRET: test-jwt-secret-for-ci
          PORT: 3001
        
      - name: Wait for backend to start
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'
        
      - name: Run end-to-end tests (if available)
        run: |
          if npm run test:e2e -w packages/frontend --if-present; then
            echo "E2E tests completed"
          else
            echo "No E2E tests found, skipping"
          fi
        env:
          BACKEND_URL: http://localhost:3001
        
      - name: Stop backend server
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
            rm backend.pid
          fi

  # Final summary job
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-audit, full-integration-test]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Full Integration | ${{ needs.full-integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.backend-tests.result }}" == "success" && "${{ needs.frontend-tests.result }}" == "success" ]]; then
            echo "✅ All core tests passed successfully!"
            exit 0
          else
            echo "❌ Some tests failed. Please check the logs above."
            exit 1
          fi
