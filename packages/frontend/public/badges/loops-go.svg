<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#00ADD8" />
  <circle cx="100" cy="100" r="80" fill="#007D9C" />
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#5FD3F3" stroke-width="4" />
  
  <!-- Loops Symbol -->
  <g transform="translate(35, 40)">
    <!-- for keyword -->
    <text x="25" y="25" font-family="monospace" font-size="22" font-weight="bold" fill="white">for</text>
    
    <!-- Loop condition -->
    <text x="5" y="50" font-family="monospace" font-size="16" font-weight="bold" fill="#FFD700">i := 0</text>
    <text x="10" y="70" font-family="monospace" font-size="16" font-weight="bold" fill="#FFD700">i &lt; 10</text>
    <text x="15" y="90" font-family="monospace" font-size="16" font-weight="bold" fill="#FFD700">i++</text>
    
    <!-- Loop body -->
    <text x="45" y="115" font-family="monospace" font-size="20" font-weight="bold" fill="white">{ }</text>
    
    <!-- Circular arrow to represent loop -->
    <path d="M 80,30 Q 110,20 120,50 Q 110,80 80,70" 
          stroke="white" stroke-width="3" fill="none" 
          marker-end="url(#arrowhead)" />
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="white" />
    </marker>
  </defs>
  
  <!-- Go gopher eyes (simplified) -->
  <circle cx="70" cy="35" r="4" fill="white" />
  <circle cx="130" cy="35" r="4" fill="white" />
  
  <!-- Small Stars -->
  <circle cx="40" cy="160" r="3" fill="white" />
  <circle cx="160" cy="160" r="4" fill="white" />
  <circle cx="30" cy="70" r="2" fill="white" />
  <circle cx="170" cy="80" r="3" fill="white" />
</svg>