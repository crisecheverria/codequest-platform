<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#00ADD8" />
  <circle cx="100" cy="100" r="80" fill="#007D9C" />
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#5FD3F3" stroke-width="4" />
  
  <!-- Strings Symbol -->
  <g transform="translate(25, 40)">
    <!-- strings package -->
    <text x="15" y="25" font-family="monospace" font-size="16" font-weight="bold" fill="white">strings.pkg</text>
    
    <!-- String operations -->
    <text x="5" y="50" font-family="monospace" font-size="12" font-weight="bold" fill="#FFD700">"Hello, World!"</text>
    
    <!-- String methods -->
    <text x="0" y="70" font-family="monospace" font-size="11" font-weight="bold" fill="white">ToUpper(str)</text>
    <text x="0" y="85" font-family="monospace" font-size="11" font-weight="bold" fill="white">Split(str, ",")</text>
    <text x="0" y="100" font-family="monospace" font-size="11" font-weight="bold" fill="white">Contains(str, "Go")</text>
    
    <!-- String concatenation -->
    <text x="10" y="120" font-family="monospace" font-size="14" font-weight="bold" fill="#FFD700">s1 + s2</text>
    
    <!-- String formatting -->
    <text x="5" y="140" font-family="monospace" font-size="11" font-weight="bold" fill="white">fmt.Sprintf("%s", val)</text>
  </g>
  
  <!-- Go gopher eyes (simplified) -->
  <circle cx="70" cy="35" r="4" fill="white" />
  <circle cx="130" cy="35" r="4" fill="white" />
  
  <!-- Small Stars -->
  <circle cx="40" cy="160" r="3" fill="white" />
  <circle cx="160" cy="160" r="4" fill="white" />
  <circle cx="30" cy="70" r="2" fill="white" />
  <circle cx="170" cy="80" r="3" fill="white" />
</svg>